[package]
name = "md1-core"
description = "Sony DSC-MD1 (MD Cyber-shot) serial protocol, disc formats and import"
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
atrac1 = { path = "../atrac1" }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "md1"
path = "src/bin/md1.rs"
