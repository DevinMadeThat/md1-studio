<!doctype html><html><head><style>html,body{margin:0;background:transparent}</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/><stop offset="1" stop-color="#121a2b"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9edf3"/><stop offset="1" stop-color="#b9c2cf"/>
    </linearGradient>
    <linearGradient id="shutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d97a6"/><stop offset=".5" stop-color="#cfd6df"/><stop offset="1" stop-color="#8d97a6"/>
    </linearGradient>
    <radialGradient id="lens" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#6fd3ff"/><stop offset=".35" stop-color="#2a6fd6"/><stop offset=".75" stop-color="#1a1f4a"/><stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <!-- macOS squircle-ish tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- MiniDisc cartridge (cut corner top-left like a real MD) -->
  <g filter="url(#sh)">
    <path d="M300 236 H724 a40 40 0 0 1 40 40 V748 a40 40 0 0 1 -40 40 H300 a40 40 0 0 1 -40 -40 V316 Z" fill="url(#shell)"/>
    <!-- metal shutter -->
    <rect x="392" y="236" width="300" height="300" rx="10" fill="url(#shutter)"/>
    <rect x="392" y="236" width="300" height="300" rx="10" fill="none" stroke="#7c8696" stroke-width="4"/>
    <!-- lens in the shutter window -->
    <circle cx="542" cy="420" r="118" fill="#20242c"/>
    <circle cx="542" cy="420" r="100" fill="url(#lens)"/>
    <circle cx="542" cy="420" r="100" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="6"/>
    <ellipse cx="510" cy="384" rx="34" ry="22" fill="#fff" fill-opacity=".55" transform="rotate(-30 510 384)"/>
    <!-- label area -->
    <rect x="312" y="600" width="400" height="140" rx="16" fill="#ffffff" fill-opacity=".85"/>
    <text x="512" y="695" font-family="-apple-system, Helvetica Neue, Arial" font-weight="800" font-size="84" text-anchor="middle" fill="#2b3a55" letter-spacing="4">MD1</text>
    <!-- write-protect tab -->
    <rect x="290" y="740" width="44" height="26" rx="6" fill="#d14b3d"/>
  </g>
</svg></body></html>
